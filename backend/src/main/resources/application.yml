server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ems
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ems?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ems}
    password: ${DB_PASSWORD:ems123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

app:
  crypto:
    key: ${APP_CRYPTO_KEY:ems-dev-only-change-me-before-production}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret}
    access-token-minutes: 120
    refresh-token-days: 7
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:ems}
  ai:
    mode: ${AI_MODE:EXTERNAL}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
  search:
    es-enabled: ${ES_ENABLED:false}
    endpoint: ${ES_ENDPOINT:http://localhost:9200}
  storage:
    local-path: ${STORAGE_PATH:./data/files}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.company.ems: DEBUG
